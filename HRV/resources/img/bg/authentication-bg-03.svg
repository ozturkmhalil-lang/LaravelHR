<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 734" width="630" height="734">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="50%" stop-color="#0f233c"/>
      <stop offset="100%" stop-color="#0a1728"/>
    </linearGradient>

    <!-- Glowing Blue Gradients -->
    <linearGradient id="primaryCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    
    <linearGradient id="brightBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2575fc"/>
      <stop offset="100%" stop-color="#6a11cb"/>
    </linearGradient>

    <linearGradient id="softBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="100%" stop-color="#2a5298"/>
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0575e6"/>
      <stop offset="100%" stop-color="#00f260"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="630" height="734" fill="url(#bgGrad)"/>

  <!-- Decorative Abstract Network Background Shapes -->
  <g opacity="0.15">
    <circle cx="315" cy="367" r="280" fill="none" stroke="#4facfe" stroke-width="1" stroke-dasharray="5,10"/>
    <circle cx="315" cy="367" r="200" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="2,15"/>
    <circle cx="315" cy="367" r="120" fill="none" stroke="#2575fc" stroke-width="1"/>
  </g>

  <!-- Abstract Org Tree / Connection Network (Human Capital Symbolism) -->
  <g>
    <!-- Connection Lines -->
    <path d="M 315,160 L 160,270 L 100,400" fill="none" stroke="#2575fc" stroke-width="3" opacity="0.6"/>
    <path d="M 315,160 L 470,270 L 530,400" fill="none" stroke="#2575fc" stroke-width="3" opacity="0.6"/>
    <path d="M 315,160 L 315,320" fill="none" stroke="#4facfe" stroke-width="3" opacity="0.7"/>
    <path d="M 160,270 L 240,400" fill="none" stroke="#1e3c72" stroke-width="2" opacity="0.5"/>
    <path d="M 470,270 L 390,400" fill="none" stroke="#1e3c72" stroke-width="2" opacity="0.5"/>
    
    <path d="M 100,400 L 70,550" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    <path d="M 240,400 L 210,550" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.4"/>
    <path d="M 390,400 L 420,550" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.4"/>
    <path d="M 530,400 L 560,550" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- Nodes - Tier 1 (Leader/Center) -->
    <circle cx="315" cy="160" r="28" fill="url(#primaryCyan)" filter="url(#glow)"/>
    <circle cx="315" cy="160" r="14" fill="#ffffff" opacity="0.9"/>

    <!-- Nodes - Tier 2 (Management/Key Pillars) -->
    <circle cx="160" cy="270" r="20" fill="url(#brightBlue)"/>
    <circle cx="160" cy="270" r="8" fill="#00f2fe"/>
    
    <circle cx="470" cy="270" r="20" fill="url(#brightBlue)"/>
    <circle cx="470" cy="270" r="8" fill="#00f2fe"/>

    <!-- Nodes - Tier 3 (Teams/Talent Pool) -->
    <circle cx="100" cy="400" r="16" fill="url(#softBlue)" stroke="#4facfe" stroke-width="2"/>
    <circle cx="240" cy="400" r="16" fill="url(#softBlue)" stroke="#4facfe" stroke-width="2"/>
    <circle cx="315" cy="320" r="18" fill="url(#accentTeal)"/>
    <circle cx="390" cy="400" r="16" fill="url(#softBlue)" stroke="#4facfe" stroke-width="2"/>
    <circle cx="530" cy="400" r="16" fill="url(#softBlue)" stroke="#4facfe" stroke-width="2"/>

    <!-- Nodes - Tier 4 (Individual Assets) -->
    <circle cx="70" cy="550" r="10" fill="#1e3c72"/>
    <circle cx="210" cy="550" r="10" fill="#1e3c72"/>
    <circle cx="420" cy="550" r="10" fill="#1e3c72"/>
    <circle cx="560" cy="550" r="10" fill="#1e3c72"/>
  </g>

  <!-- Abstract Growth / Analytics Elements at the bottom (HR Performance) -->
  <g opacity="0.85">
    <rect x="80" y="650" width="60" height="24" rx="6" fill="url(#softBlue)"/>
    <rect x="160" y="630" width="60" height="44" rx="6" fill="url(#brightBlue)"/>
    <rect x="240" y="600" width="60" height="74" rx="6" fill="url(#primaryCyan)" filter="url(#glow)"/>
    <rect x="320" y="615" width="60" height="59" rx="6" fill="url(#brightBlue)"/>
    <rect x="400" y="580" width="60" height="94" rx="6" fill="url(#accentTeal)"/>
    <rect x="480" y="640" width="60" height="34" rx="6" fill="url(#softBlue)"/>
  </g>

  <!-- Floating abstract talent/hiring funnel graphics (Left & Right top) -->
  <path d="M 60,120 L 140,120 L 110,170 L 90,170 Z" fill="url(#primaryCyan)" opacity="0.3"/>
  <line x1="100" y1="175" x2="100" y2="195" stroke="#00f2fe" stroke-width="3" opacity="0.6"/>
  <circle cx="100" cy="205" r="4" fill="#00f2fe"/>

  <path d="M 570,120 L 490,120 L 520,170 L 540,170 Z" fill="url(#brightBlue)" opacity="0.4"/>
  <line x1="530" y1="175" x2="530" y2="195" stroke="#2575fc" stroke-width="3" opacity="0.6"/>
  <circle cx="530" cy="205" r="4" fill="#2575fc"/>

  <!-- Subtle grid overlay for tech/corporate feel -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="91" x2="630" y2="91"/>
    <line x1="0" y1="183" x2="630" y2="183"/>
    <line x1="0" y1="275" x2="630" y2="275"/>
    <line x1="0" y1="367" x2="630" y2="367"/>
    <line x1="0" y1="459" x2="630" y2="459"/>
    <line x1="0" y1="551" x2="630" y2="551"/>
    <line x1="0" y1="643" x2="630" y2="643"/>
    
    <line x1="90" y1="0" x2="90" y2="734"/>
    <line x1="180" y1="0" x2="180" y2="734"/>
    <line x1="270" y1="0" x2="270" y2="734"/>
    <line x1="360" y1="0" x2="360" y2="734"/>
    <line x1="450" y1="0" x2="450" y2="734"/>
    <line x1="540" y1="0" x2="540" y2="734"/>
  </g>
</svg>
